<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgHealth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090610"/>
      <stop offset="50%" stop-color="#190e2e"/>
      <stop offset="100%" stop-color="#081622"/>
    </linearGradient>
    <radialGradient id="glowHealth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d8d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgHealth)"/>
  <rect width="1600" height="900" fill="url(#glowHealth)"/>

  <!-- Header -->
  <text x="110" y="95" fill="#ff6b9d" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="3">REACT NATIVE &amp; WEB TELEMETRY PLATFORM</text>
  <text x="110" y="150" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800">Real-Time Health Monitoring App</text>

  <rect x="1200" y="95" width="290" height="48" rx="24" fill="#1d1433" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="1345" y="125" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="18" font-weight="700">♥ Live Vitals &amp; Cloud Sync</text>

  <!-- Left Mobile Phone Mockup (React Native App) -->
  <rect x="130" y="190" width="380" height="580" rx="44" fill="#120c22" stroke="#c2a4ff" stroke-opacity="0.45" stroke-width="3"/>
  <rect x="260" y="210" width="120" height="22" rx="11" fill="#080510"/>
  <text x="170" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Good Morning, Abhishek</text>
  <text x="170" y="302" fill="#9f94b8" font-family="system-ui, sans-serif" font-size="14">React Native iOS &amp; Android Sync</text>

  <!-- Heart Rate Card inside Phone -->
  <rect x="165" y="325" width="310" height="175" rx="20" fill="#1c1233" stroke="#ff6b9d" stroke-opacity="0.4"/>
  <text x="190" y="360" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="16" font-weight="700">♥ HEART RATE (LIVE)</text>
  <text x="190" y="410" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800">74 BPM</text>
  <path d="M190 460 L230 460 L245 430 L260 480 L275 415 L292 475 L308 445 L330 460 L445 460" fill="none" stroke="#ff6b9d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- SpO2 & Sleep Cards inside Phone -->
  <rect x="165" y="520" width="145" height="125" rx="18" fill="#1c1233" stroke="#00d4ff" stroke-opacity="0.35"/>
  <text x="185" y="555" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BLOOD OXYGEN</text>
  <text x="185" y="605" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">98%</text>

  <rect x="330" y="520" width="145" height="125" rx="18" fill="#1c1233" stroke="#10b981" stroke-opacity="0.35"/>
  <text x="350" y="555" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700">DAILY STEPS</text>
  <text x="350" y="605" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">8,420</text>

  <rect x="165" y="665" width="310" height="65" rx="16" fill="#251742"/>
  <text x="320" y="705" text-anchor="middle" fill="#c2a4ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">● MongoDB Atlas Encrypted Sync</text>

  <!-- Right Web Analytics Dashboard -->
  <rect x="550" y="190" width="940" height="580" rx="22" fill="#130d24" stroke="#c2a4ff" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="595" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="800">Web Companion Dashboard &amp; Patient Telemetry</text>
  <text x="595" y="282" fill="#9f94b8" font-family="system-ui, sans-serif" font-size="16">Real-time WebSocket stream • Authenticated User Profiles • Cloud History</text>

  <!-- ECG / Vitals Graph Box -->
  <rect x="595" y="310" width="850" height="240" rx="16" fill="#191230" stroke="#c2a4ff" stroke-opacity="0.25"/>
  <text x="625" y="350" fill="#c2a4ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Continuous Biometric Telemetry Stream</text>
  <path d="M625 470 L710 470 L735 410 L755 510 L780 370 L805 500 L825 445 L860 470 L980 470 L1005 405 L1025 505 L1050 365 L1075 495 L1100 445 L1140 470 L1260 470 L1285 410 L1310 500 L1335 380 L1360 485 L1410 470" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom 3 Summary Cards -->
  <rect x="595" y="575" width="265" height="150" rx="14" fill="#191230" stroke="#c2a4ff" stroke-opacity="0.25"/>
  <text x="622" y="615" fill="#9f94b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">SLEEP QUALITY</text>
  <text x="622" y="668" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="800">7h 45m</text>
  <text x="622" y="702" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="600">92% Optimal Recovery</text>

  <rect x="887" y="575" width="265" height="150" rx="14" fill="#191230" stroke="#c2a4ff" stroke-opacity="0.25"/>
  <text x="914" y="615" fill="#9f94b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">CALORIES BURNED</text>
  <text x="914" y="668" fill="#c2a4ff" font-family="system-ui, sans-serif" font-size="36" font-weight="800">2,180 kcal</text>
  <text x="914" y="702" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Active Goal Reached</text>

  <rect x="1180" y="575" width="265" height="150" rx="14" fill="#191230" stroke="#c2a4ff" stroke-opacity="0.25"/>
  <text x="1207" y="615" fill="#9f94b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">CLOUD RECORDS</text>
  <text x="1207" y="668" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="800">MongoDB</text>
  <text x="1207" y="702" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="15" font-weight="600">JWT Secured Sessions</text>

  <!-- Footer Tech Pills -->
  <g transform="translate(110, 800)">
    <rect x="0" y="0" width="175" height="44" rx="22" fill="#1e1533" stroke="#c2a4ff" stroke-opacity="0.4"/>
    <text x="87" y="28" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="600">React Native</text>

    <rect x="195" y="0" width="145" height="44" rx="22" fill="#1e1533" stroke="#c2a4ff" stroke-opacity="0.4"/>
    <text x="267" y="28" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="600">React.js</text>

    <rect x="360" y="0" width="145" height="44" rx="22" fill="#1e1533" stroke="#c2a4ff" stroke-opacity="0.4"/>
    <text x="432" y="28" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="600">Node.js</text>

    <rect x="525" y="0" width="160" height="44" rx="22" fill="#1e1533" stroke="#c2a4ff" stroke-opacity="0.4"/>
    <text x="605" y="28" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="600">MongoDB</text>
  </g>
</svg>

